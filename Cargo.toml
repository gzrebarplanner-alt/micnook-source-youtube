[package]
name = "source-youtube"
version = "1.0.9"
description = "MicNook 的 YouTube 匯入來源（另外散布的擴充，見 README）"
edition = "2024"
license = "MIT"

[dependencies]
serde_json = "1"
# 第一次使用時下載 yt-dlp
ureq = "3"

# Windows：下載 python.org 的 embeddable Python（解開 zip、核對 SHA-256）
[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
